site_name: STS2 Modding Notes
site_description: Practical Slay the Spire 2 modding discoveries, hooks, and inspection notes.
repo_url: https://github.com/Shashakar/sts2-modding-notes
edit_uri: edit/main/

docs_dir: docs
site_dir: .site

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Start Here:
      - Getting Started: getting-started.md
      - Environment Setup: environment-setup.md
      - Mod Loading: mod-loading.md
      - Deployment: deployment.md
      - Common Errors: common-errors.md
  - Findings:
      - Known Hooks: known-hooks.md
      - Run Lifecycle: run-lifecycle.md
      - Multiplayer Lobby: multiplayer-lobby.md
      - Harmony Patching: harmony-patching.md
      - Useful Types: useful-types.md
  - Reference:
      - Glossary: glossary.md
      - Discovery Log: discovery-log.md
      - Generated Docs: generated/README.md
      - Generated API:
          - RunState: generated/RunState.md
          - Player: generated/Player.md
          - StartRunLobby: generated/StartRunLobby.md
          - CombatManager: generated/CombatManager.md
          - RunSaveManager: generated/RunSaveManager.md
          - RunHistorySaveManager: generated/RunHistorySaveManager.md
          - ProgressSaveManager: generated/ProgressSaveManager.md
          - Hook: generated/Hook.md
          - RunLobby: generated/RunLobby.md
          - BaseLib: generated/BaseLib.md
  - Research:
      - Community Research: community-research.md
      - Raw References: references/README.md
      - Potential Methods:
          - Overview: references/potential-methods/README.md
          - Run-End and Save Candidates: references/potential-methods/run-end-and-save-candidates.md
  - Tools:
      - Sts2Inspector: tools/sts2-inspector.md
